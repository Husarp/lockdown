<!-- Look cache (cosmetic only, written by js/theme.js; same origin as the main window): applied before the first paint. -->
<script>(function(){try{var l=JSON.parse(localStorage.getItem("ld.look")||"null");if(!l)return;var d=document.documentElement,
t=l.pref==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):l.pref;if(!/^(dark|amoled|light)$/.test(t))return;
d.dataset.theme=t;var v=l.vars&&l.vars[t];if(v)for(var k in v)d.style.setProperty(k,v[k]);if(l.s)d.style.setProperty("--s",l.s)}catch(e){}})()</script>
<style>
html,body{margin:0;overflow:hidden;background:#191817;color:#EFECEA}
html[data-theme=light],html[data-theme=light] body{background:#F3F2F1;color:#1C1B1A}
html[data-theme=amoled],html[data-theme=amoled] body{background:#000}
</style>
