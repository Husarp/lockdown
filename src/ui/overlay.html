<title>Lockdown overlay</title>
<link rel="icon" href="data:,">
<!-- Early error hook, before any module: every script error, file that fails to load and unhandled rejection of this page
     goes to the Lockdown log through pywebview's Api as soon as that is there - also when the page's own modules never
     run (js/bridge.js leaves the reporting to this when it sees __ldErrorHook). -->
<script>(function(w){var q=[],n=0;w.__ldErrorHook=1;function send(){var a=w.pywebview&&w.pywebview.api;if(!a||typeof a.log_client_error!=="function")return;
while(q.length){try{var p=a.log_client_error(q.shift());if(p&&p.catch)p.catch(function(){})}catch(e){}}}
function add(m){if(n++<8){q.push((location.pathname+": "+m).slice(0,2000));send()}}
w.addEventListener("error",function(e){var t=e.target;if(t&&t!==w&&t.tagName)add("could not load "+(t.src||t.href||t.tagName));
else add((e.message||"error")+" ("+(e.filename||"?")+":"+(e.lineno||0)+")")},true);
w.addEventListener("unhandledrejection",function(e){var r=e.reason;add("unhandled: "+(r&&r.stack?r.stack:r))});
w.addEventListener("pywebviewready",send)})(window)</script>
<!-- Look cache (cosmetic only, written by js/theme.js; same origin as the main window): applied before the first paint. -->
<script>(function(){try{var l=JSON.parse(localStorage.getItem("ld.look")||"null");if(!l)return;var d=document.documentElement,
t=l.pref==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):l.pref;if(!/^(dark|amoled|light)$/.test(t))return;
d.dataset.theme=t;var v=l.vars&&l.vars[t];if(v)for(var k in v)d.style.setProperty(k,v[k]);if(l.s)d.style.setProperty("--s",l.s)}catch(e){}})()</script>
<style>
html,body{margin:0;overflow:hidden;background:#191817;color:#EFECEA}
html[data-theme=light],html[data-theme=light] body{background:#F3F2F1;color:#1C1B1A}
html[data-theme=amoled],html[data-theme=amoled] body{background:#000}
</style>
